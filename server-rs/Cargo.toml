[package]
name = "t3code-server"
version = "0.1.0"
edition = "2021"
publish = false
# R3-authored server code: AGPL-3.0-only. T3 Code-derived material inside this
# crate (upstream wire contracts and copied strings) keeps its MIT license; see
# ../COMPONENT-LICENSES.md.
license = "AGPL-3.0-only"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
hmac = "0.12"
ring = "0.17"
sha2 = "0.10"
getrandom = "0.3"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "fs", "io-util", "process"] }
futures-util = "0.3"
httpdate = "1"
url = "2"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
iana-time-zone = "0.1"
percent-encoding = "2"
prost = "0.14"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "with-serde"] }
mime_guess = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-deflate", "compression-br", "cors"] }
ignore = "0.4"
globset = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
encoding_rs = "0.8"
notify = "8"
shlex = "1"
flate2 = "1"
tar = "0.4"
zstd = "0.13"
sysinfo = "0.40.1"

[dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
errno = "0.3"

[target."cfg(windows)".dependencies]
portable-pty = "0.9.0"
windows-sys = { version = "0.59", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

# Keep the shared workspace's test artifacts bounded during parallel development.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
