[package]
name = "t3code-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "t3code"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
t3code-core = { path = "../t3code-core" }
t3code-protocol = { path = "../t3code-protocol" }
t3code-ui = { path = "../t3code-ui" }

[features]
# Render tests need gpui's headless harness.
test-support = ["gpui/test-support"]
