[workspace]
resolver = "2"
members = [
    "crates/t3code-protocol",
    "crates/t3code-core",
    "crates/t3code-ui",
    "crates/t3code-kit",
    "crates/t3code-app",
]
exclude = ["server-rs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.12" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
